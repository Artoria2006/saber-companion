name: Code checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: 安装固定的直接依赖
        run: python -m pip install -r requirements.txt
      - name: 安装并运行静态检查
        run: |
          python -m pip install ruff==0.15.22
          ruff check --select F .
      - name: 检查依赖一致性
        run: python -m pip check
      - name: 检查 Python 语法
        run: python -m compileall -q .

  qq-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 检查电话桥 JavaScript 语法
        run: node --check third_party/qq-call/bridge/napcat-plugin/index.mjs
