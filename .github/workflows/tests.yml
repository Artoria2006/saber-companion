name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: 安装固定的直接依赖
        run: python -m pip install -r requirements.txt
      - name: 检查依赖一致性
        run: python -m pip check
      - name: 运行离线模拟测试
        # 测试使用示例配置和模拟模型，不需要真实 QQ 或模型密钥。
        run: python -m unittest -v test_chat.py
