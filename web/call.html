<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>和 Saber 通话</title><style>
*{box-sizing:border-box}body{margin:0;background:#101723;color:#f8eee7;font-family:system-ui,"Microsoft YaHei",sans-serif;min-height:100vh;display:grid;place-items:center}main{width:min(100%,540px);padding:28px 22px;text-align:center}a{color:#d2bda8;float:left;text-decoration:none}.badge{margin:45px auto 14px;width:120px;height:120px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(145deg,#d9c2a2,#806c87);font-family:serif;font-size:68px;box-shadow:0 0 60px #9a849a55}h1{font-size:26px;margin:0}p{color:#c8c3c6;line-height:1.65}.status{min-height:3em;color:#ead3b7}.card{background:#1d2734;border:1px solid #ffffff14;border-radius:18px;padding:16px;text-align:left;margin:20px 0;min-height:110px}.card p{margin:7px 0;overflow-wrap:anywhere}label{display:block;text-align:left;color:#d8cbbf;font-size:14px}input{width:100%;border:1px solid #ffffff30;border-radius:10px;background:#111923;color:white;padding:12px;margin:8px 0 15px}button{background:#d7bb9b;color:#211b1b;border:0;border-radius:30px;padding:14px 24px;font-size:16px;cursor:pointer}button:disabled{opacity:.4}button.hang{background:#7c3942;color:white}small{display:block;color:#aeb4be;line-height:1.6;margin-top:20px}.hidden{display:none}
</style><script defer src="/call/app.js"></script></head><body><main><a href="/panel/">‹ 返回面板</a><div class="badge">S</div><h1>和 Saber 通话</h1><p class="status" id="status">准备好后，允许使用麦克风就能开始。</p><div id="auth"><label>管理口令<input id="token" type="password" autocomplete="current-password" placeholder="与管理面板口令相同"></label></div><button id="start">开始通话</button> <button class="hang hidden" id="stop">挂断</button><div class="card" aria-live="polite"><p id="heard">你说的话会显示在这里。</p><p id="reply">Saber 的回复会显示在这里。</p></div><small>停止说话后，她会接话；想打断时直接说话。建议戴耳机，避免她的声音被麦克风再次收录。通话转写会发送给已配置的模型服务，并与 QQ 对话共享记忆。</small></main></body></html>
